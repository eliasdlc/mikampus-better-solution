# Litestream v0.3 conserva la réplica cifrada del archivo SQLite fuera del
# volumen del Droplet. El recipient público cifra; la identidad privada para
# restaurar se guarda fuera de este repo y fuera del bucket.
dbs:
  - path: /data/mikampus.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: mikampus.db
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 72h
        retention-check-interval: 1h
        snapshot-interval: 24h
        age:
          recipients:
            - ${LITESTREAM_AGE_RECIPIENT}
